<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Participantes en la sala</title>
<style>
  :root { --dark:#14213D; --light:#F6F3EC; --accent:#B04A17; --muted:#5B6577; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--light); color:var(--dark); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh; text-align:center; padding:4vh 4vw; }
  .eyebrow { font-size:clamp(14px,2vh,24px); letter-spacing:3px; text-transform:uppercase; color:var(--accent); font-weight:700; margin:0; }
  .n { font-family:Georgia,"Times New Roman",serif; font-weight:700; font-size:clamp(96px,30vh,320px); line-height:1; transition:transform .3s ease; }
  .n.pop { transform:scale(1.08); }
  .lab { font-size:clamp(22px,4vh,48px); font-weight:600; }
  .reloj { font-variant-numeric:tabular-nums; font-size:clamp(28px,6vh,72px); color:var(--accent); font-weight:700; margin-top:2vh; }
  .muted { color:var(--muted); font-size:clamp(12px,1.8vh,20px); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Experimento en la sala</p>
  <div class="n" id="n">–</div>
  <div class="lab" id="lab">respuestas</div>
  <div class="reloj" id="reloj">0:00</div>
  <div class="muted" id="estado">Esperando respuestas…</div>
</main>
<script src="config.js"></script>
<script>
(function () {
  // live count of participants only (no results by group, so the room is not told the answer before the end)
  var endpoint = window.ENCUESTA_ENDPOINT || "";
  var sesion = new URLSearchParams(location.search).get("s") || "csic";
  var $ = function (id) { return document.getElementById(id); };
  var ultimo = null;
  function actualiza() {
    if (!endpoint) { $("estado").textContent = "Votación no configurada"; return; }
    fetch(endpoint + "?accion=resultados&sesion=" + encodeURIComponent(sesion) + "&t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var n = ((d.par && d.par.n) || 0) + ((d.impar && d.impar.n) || 0);
        $("n").textContent = n;
        $("lab").textContent = n === 1 ? "respuesta" : "respuestas";
        if (ultimo !== null && n !== ultimo) { $("n").classList.add("pop"); setTimeout(function () { $("n").classList.remove("pop"); }, 300); }
        ultimo = n;
        $("estado").textContent = "Actualizado " + new Date().toLocaleTimeString("es-ES");
      })
      .catch(function () { $("estado").textContent = "Sin conexión; reintentando…"; });
  }
  // time since this page was opened
  var t0 = Date.now();
  function reloj() {
    var s = Math.floor((Date.now() - t0) / 1000);
    $("reloj").textContent = Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  reloj();
  setInterval(reloj, 250);
  actualiza();
  setInterval(actualiza, 2000);
})();
</script>
</body>
</html>
